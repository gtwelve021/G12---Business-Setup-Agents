<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: transparent;
        color: #172033;
      }

      .wrap {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .item {
        display: grid;
        gap: 6px;
        border: 1px solid rgba(23, 32, 51, 0.14);
        border-radius: 8px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.8);
      }

      .title {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
      }

      .meta {
        font-size: 12px;
        color: #5d6678;
        overflow-wrap: anywhere;
      }

      button {
        width: fit-content;
        border: 1px solid #172033;
        border-radius: 6px;
        background: #172033;
        color: #fff;
        font: inherit;
        font-size: 13px;
        padding: 7px 10px;
        cursor: pointer;
      }

      .empty {
        color: #5d6678;
        font-size: 14px;
        padding: 12px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #eef2f8;
        }

        .item {
          border-color: rgba(238, 242, 248, 0.18);
          background: rgba(20, 27, 42, 0.82);
        }

        .meta {
          color: #aab3c4;
        }

        button {
          border-color: #eef2f8;
          background: #eef2f8;
          color: #172033;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap" id="results"></main>
    <script>
      const root = document.getElementById("results");
      let latestOutput = window.openai?.toolOutput;

      function render(output) {
        const results = Array.isArray(output?.results) ? output.results : [];
        root.innerHTML = "";

        if (!results.length) {
          root.innerHTML = '<div class="empty">No G12 results to show.</div>';
          return;
        }

        for (const result of results) {
          const item = document.createElement("section");
          item.className = "item";

          const title = document.createElement("div");
          title.className = "title";
          title.textContent = result.title || "Untitled";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = result.url || "";

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Open page";
          button.addEventListener("click", () => {
            if (window.openai?.openExternal && result.url) {
              window.openai.openExternal({ href: result.url });
            } else if (result.url) {
              window.open(result.url, "_blank", "noopener,noreferrer");
            }
          });

          item.append(title, meta, button);
          root.append(item);
        }
      }

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (message.method !== "ui/notifications/tool-result") return;
          latestOutput = message.params?.structuredContent;
          render(latestOutput);
        },
        { passive: true }
      );

      render(latestOutput);
      window.addEventListener(
        "openai:set_globals",
        (event) => {
          latestOutput = event.detail?.globals?.toolOutput ?? window.openai?.toolOutput;
          render(latestOutput);
        },
        { passive: true }
      );
    </script>
  </body>
</html>
